name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests share a group so a new push cancels the stale run; every commit on main gets
  # its own run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `just changelog` compares the newest heading with the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2

      - name: Install the pinned nightly rustfmt
        run: just install-nightly-rustfmt

      # install-action has no actionlint package; the runner image has Go.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: just fmt-check
      - run: just typos
      - run: just actionlint
      - run: just zizmor
      - run: just shear
      - run: just deny
      - run: just changelog
      - run: just release-test
      - run: just links
      - run: just pins

  policy:
    name: Policy and custom lints
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-cache reads the root toolchain to key its cache, so both toolchains are installed.
      - name: Install the pinned toolchains
        run: |
          rustup toolchain install
          cd lints && rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            lints -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,shellcheck@0.11.0

      - run: just lints-lint
      - run: just lints-comments
      - run: just lints-test
      - run: just lint
      - run: just dylint
      - run: just test
        env:
          NEXTEST_PROFILE: ci
      - run: just docs

  template:
    name: Template (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: binary
            os: ubuntu-26.04
            kind: binary
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3
          - name: binary with a desktop interface
            os: ubuntu-26.04
            kind: binary
            interfaces: desktop
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3
          - name: binary with a terminal interface
            os: ubuntu-26.04
            kind: binary
            interfaces: terminal
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3
          - name: binary with a web UI
            os: ubuntu-26.04
            kind: binary
            web: "true"
            interfaces: web,cli
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3
          - name: service
            os: ubuntu-26.04
            kind: service
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3
          - name: service with a web UI
            os: ubuntu-26.04
            kind: service
            web: "true"
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3
          - name: library
            os: ubuntu-26.04
            kind: library
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8
          - name: published library
            os: ubuntu-26.04
            kind: library
            publish: "true"
            recipes: ci
            tools: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8
          # A generated binary's CI runs `test` and `build-release` for each target, and these
          # recipes on each runner but Linux on x86-64's; its release build runs `notices` there.
          - name: binary for Linux on x86-64
            os: ubuntu-26.04
            kind: binary
            target: x86_64-unknown-linux-musl
            recipes: test build-release
            tools: just@1.59.0,cargo-nextest@0.9.150,uv@0.13.8
          - name: binary on Linux on ARM64
            os: ubuntu-26.04-arm
            kind: binary
            target: aarch64-unknown-linux-musl
            recipes: lint dylint test docs build-release notices
            tools: just@1.59.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3,shellcheck@0.11.0
            checker: "true"
          - name: binary on macOS
            os: macos-26
            kind: binary
            target: aarch64-apple-darwin
            recipes: lint dylint test docs build-release notices
            tools: just@1.59.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3,shellcheck@0.11.0
            checker: "true"
          - name: binary on Windows
            os: windows-2025
            kind: binary
            target: x86_64-pc-windows-msvc
            recipes: lint dylint test docs build-release notices
            tools: just@1.59.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3,shellcheck@0.11.0
            checker: "true"
          - name: binary on Windows on ARM64
            os: windows-11-arm
            kind: binary
            target: aarch64-pc-windows-msvc
            recipes: lint dylint test docs build-release notices
            tools: just@1.59.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3,shellcheck@0.11.0
            checker: "true"
          # A binary with a web UI builds it and writes its notices on its Windows release runners
          # too, through the PowerShell recipes.
          - name: binary with a web UI on Windows
            os: windows-2025
            kind: binary
            web: "true"
            recipes: web-check web-build notices
            tools: just@1.59.0,uv@0.13.8,cargo-about@0.9.3
          # A binary whose release answer gives the target an Inno Setup installer: its release
          # build's own steps build it, and tests/installer/run.sh installs, upgrades and
          # uninstalls it.
          - name: binary with an installer on Windows
            os: windows-2025
            kind: binary
            target: x86_64-pc-windows-msvc
            installer: "true"
            recipes: notices
            tools: just@1.59.0,uv@0.13.8,cargo-about@0.9.3
          - name: binary with an installer on Windows on ARM64
            os: windows-11-arm
            kind: binary
            target: aarch64-pc-windows-msvc
            installer: "true"
            recipes: notices
            tools: just@1.59.0,uv@0.13.8,cargo-about@0.9.3
          # The published library's `package` recipe has a PowerShell variant only Windows runs.
          - name: published library on Windows
            os: windows-2025
            kind: library
            publish: "true"
            recipes: package lint dylint test
            tools: just@1.59.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: ${{ matrix.tools }}

      - name: Install the pinned toolchains
        shell: bash
        run: |
          rustup toolchain install
          just install-nightly-rustfmt
          cd lints && rustup toolchain install

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.web == 'true'
        with:
          bun-version: 1.4.4

      - name: Install actionlint
        if: matrix.recipes == 'ci'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate a ${{ matrix.kind }} project and run its checks
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          RECIPES: ${{ matrix.recipes }}
          PUBLISH: ${{ matrix.publish || 'false' }}
          WEB: ${{ matrix.web || 'false' }}
          TARGET: ${{ matrix.target }}
          INSTALLER: ${{ matrix.installer || 'false' }}
          INTERFACES: ${{ matrix.interfaces }}
        run: just template "$KIND" "$RECIPES" "$PUBLISH" "$WEB" "$TARGET" "$INSTALLER" "$INTERFACES"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.installer == 'true'
        with:
          name: installer-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/installer-test/logs
          retention-days: 7
          if-no-files-found: warn

      # `Policy and custom lints` tests the checker on Linux on x86-64. These entries run its tests
      # on every other system and processor CI has, since file systems differ in what the checker
      # reads: letter case, path separators, symbolic links and the names a file may have.
      - name: Test the checker
        if: matrix.checker == 'true'
        shell: bash
        env:
          NEXTEST_PROFILE: ci
        run: just test

  dependencies:
    name: Template with common dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,cargo-nextest@0.9.150,cargo-dylint@6.4.0,dylint-link@6.4.0,uv@0.13.8,cargo-about@0.9.3

      - name: Install the pinned toolchains
        run: |
          rustup toolchain install
          just install-nightly-rustfmt
          cd lints && rustup toolchain install

      - run: just dependencies

  shapes:
    name: Template shapes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.51.1,taplo@0.10.0,shellcheck@0.11.0,zizmor@1.31.1,lychee@0.24.2,uv@0.13.8,cargo-about@0.9.3

      - name: Install the pinned toolchains
        run: |
          rustup toolchain install
          just install-nightly-rustfmt

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: just shapes
      - run: just outlines
      - run: just update
      - run: just build-extras
      - run: just image-extras
      - run: just release-extras

  # A project on Windows installs its checker through the PowerShell form of `install-policy`,
  # which no other job runs.
  checker-install:
    name: Checker install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: Windows
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,uv@0.13.8

      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install

      - run: just checker-install
        shell: bash

  # A generated binary's workflows build C code for musl after the musl-gcc step this job copies.
  # `just pins` keeps the two the same.
  musl-c:
    name: C code for musl (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl-gcc
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build C code for musl and run it
        env:
          TARGET: ${{ matrix.target }}
        run: cargo run --locked --release --manifest-path tests/musl-c/Cargo.toml --target "$TARGET"

  # A generated service's CI and release build its arm64 image on an x86-64 runner, cross-compiling
  # it. This builds one the same way, and `service-image-run` starts it on ARM64.
  service-image:
    name: Service image for ARM64
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,uv@0.13.8,cargo-about@0.9.3

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: just service-image linux/arm64 "$RUNNER_TEMP/image-aarch64.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-image
          path: ${{ runner.temp }}/image-aarch64.tar
          retention-days: 1
          if-no-files-found: error

  service-image-run:
    name: Run the service image on ARM64
    needs: service-image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-image

      - name: Run the image
        run: |
          docker load --input image-aarch64.tar
          docker run --rm demo-service:ci --version

  # Branch protection requires this job instead of each job by name, so `needs` lists every other
  # job but `release`, which runs after it, and a new job goes there rather than into branch
  # protection. It runs with `always()` because a job whose needs fail is skipped, and GitHub
  # counts a skipped required check as passing.
  passed:
    name: CI passed
    needs: [quick, policy, template, dependencies, shapes, checker-install, musl-c, service-image, service-image-run]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq --raw-output 'to_entries[] | select(.value.result != "success") | "::error::\(.key) ended with \(.value.result)."' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi

  # Tags the commit when it changed the section of a version in CHANGELOG.md that no commit has, as
  # "Release trellis" in CONTRIBUTING.md describes. It has no concurrency group, since a group keeps
  # only its newest waiting job and could drop the commit that should get the tag. When two runs
  # race, GitHub refuses the second tag and that run skips.
  release:
    name: Release
    needs: [passed]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # Creates the tag and publishes the release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0

      - name: Tag and release the newest version in CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: just release
