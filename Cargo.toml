[workspace]
resolver = "3"
members = ["policy"]
# The custom lints build on their own nightly toolchain; `cargo dylint` loads them.
exclude = ["lints"]

[workspace.metadata.dylint]
libraries = [{ path = "lints" }]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/265866/trellis"
license = "MIT"
publish = false

[workspace.dependencies]
# `trellis-policy` reads `cargo metadata`, parses manifests, and lexes Rust sources with
# proc-macro2's own lexer, which gives line numbers. It never writes TOML. It reads Markdown with
# comrak, which implements cmark-gfm, the parser GitHub renders Markdown with, without its command
# line or syntax highlighting. It reads the `package.json` of each npm package a web UI installs
# with serde_json, which cargo_metadata already depends on, and judges each one's license with
# spdx, the crate cargo-about and cargo-deny judge licenses with, at the version cargo-deny uses.
# It folds paths with caseless and unicode-normalization, which comrak already depends on, to find
# two that macOS or Windows reads as one. Its tests build git repositories in temporary
# directories.
caseless = "0.2.2"
cargo_metadata = "0.23.1"
comrak = { version = "1.0.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "1.0.154"
spdx = "0.13.6"
tempfile = "3.27.0"
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde", "std"] }
unicode-normalization = "0.1.26"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# Exceptions to the custom lints are written `#[cfg_attr(dylint_lib = "trellis_lints", expect(...))]`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] }
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The custom `enum_glob_outside_fn` lint replaces it: the Google guide allows `use Enum::*` inside
# a function that handles the enum, which this flags too.
enum_glob_use = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
let_underscore_must_use = "warn"
doc_paragraphs_missing_punctuation = "warn"
exit = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
todo = "warn"
unused_result_ok = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "abort"
