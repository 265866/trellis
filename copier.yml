_min_copier_version: "9.10.0"
_subdirectory: template
_answers_file: .copier-answers.yml
# The project's own once generated: a starter that an update never overwrites.
_skip_if_exists:
  - .github/setup-build.sh
  - release/installer-custom.iss
# The answers an update starts from, which the `release` answer's check compares an installer's
# `app_id` with.
_external_data:
  previous: .copier-answers.yml
# Copier prints this after an interactive copy, but not under `--quiet`, so docs/maintaining.md
# stays the full procedure.
_message_after_copy: |
  Next steps for {{ project_name }}, in its directory:

  1. Commit it on main:
       git init --initial-branch main
       git add -A
       git commit -m "chore: generate from trellis"
  2. Install gh (https://cli.github.com/){% if web_ui %}, the Bun version CONTRIBUTING.md names{% endif %} and cargo-binstall (https://github.com/cargo-bins/cargo-binstall), then the just version the project pins:
       cargo binstall just@1.59.0
  3. Install the tools and toolchains, then run every check:
       just install-tools
       just install-toolchains
       just ci
  4. Follow "Before the first push" in docs/maintaining.md. It creates {{ github_owner }}/{{ project_name }}
     as {{ visibility }}, runs `just setup-github`, which on Windows runs in Git Bash, and pushes main.
_exclude:
  - copier.yml
  - "~*"
  - .git
  - .DS_Store
  # The files only some answers get. An item that renders empty excludes nothing, and a leading
  # `/` matches only at the project's root.
  - "{% if kind != 'binary' %}/.github/workflows/build-release.yml{% endif %}"
  - "{% if not (kind == 'binary' and 'windows' in platforms) %}/.cargo{% endif %}"
  - "{% if kind != 'service' %}/.dockerignore{% endif %}"
  # Copier also matches these against the files of the trellis version a project updates from,
  # with that version's answers, so an answer it didn't have yet is read with a default.
  - "{% if not (kind == 'binary' and (build | default({})).setup | default(false)) %}/.github/setup-build.sh{% endif %}"
  - "{% if kind != 'service' %}/Containerfile{% endif %}"
  - "{% if kind == 'library' %}/about.hbs{% endif %}"
  - "{% if kind == 'library' %}/about.toml{% endif %}"
  - "{% if kind == 'library' %}/docs/install.md{% endif %}"
  - "{% if kind == 'library' %}/docs/verifying-releases.md{% endif %}"
  - "{% if license != 'MIT' %}/LICENSE{% endif %}"
  - "{% if license != 'MIT OR Apache-2.0' %}/LICENSE-MIT{% endif %}"
  - "{% if license != 'MIT OR Apache-2.0' %}/LICENSE-APACHE{% endif %}"
  - "{% if not (publish_crate and license == 'MIT') %}/crates/{{ crate_name }}/LICENSE{% endif %}"
  - "{% if not (publish_crate and license == 'MIT OR Apache-2.0') %}/crates/{{ crate_name }}/LICENSE-MIT{% endif %}"
  - "{% if not (publish_crate and license == 'MIT OR Apache-2.0') %}/crates/{{ crate_name }}/LICENSE-APACHE{% endif %}"
  # The scaffold is the project's own code and history once generated, so an update leaves it
  # alone, apart from a published crate's license files, which follow the answers. A `!` item
  # adds back what `crates` excluded, so each repeats its file's condition above.
  - "{% if _copier_operation == 'update' %}crates{% endif %}"
  - "{% if _copier_operation == 'update' and publish_crate and license == 'MIT' %}!/crates/{{ crate_name }}/LICENSE{% endif %}"
  - "{% if _copier_operation == 'update' and publish_crate and license == 'MIT OR Apache-2.0' %}!/crates/{{ crate_name }}/LICENSE-MIT{% endif %}"
  - "{% if _copier_operation == 'update' and publish_crate and license == 'MIT OR Apache-2.0' %}!/crates/{{ crate_name }}/LICENSE-APACHE{% endif %}"
  - "{% if _copier_operation == 'update' %}Cargo.lock{% endif %}"
  - "{% if _copier_operation == 'update' %}CHANGELOG.md{% endif %}"
  - "{% if _copier_operation == 'update' %}docs/design.md{% endif %}"

project_name:
  type: str
  help: The repository and binary name, in kebab-case, such as `my-tool`
  # With a longer name, rustfmt wraps lines of the scaffold that hold the crate's name, so
  # `just ci` fails on the project as generated.
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Use lowercase letters and digits, with single hyphens between words.
    {% elif project_name | length > 55 %}
    Use at most 55 characters.
    {% endif %}

description:
  type: str
  help: >-
    One sentence that says what it does, in plain words. It becomes the crate docs, where clippy
    fails a CamelCase word outside backticks, so put each one in backticks, whether a product name
    such as `SkyBlock` or a code name such as `JsonValue`.
  validator: >-
    {% if not (description | regex_search('^[A-Z][^<>\\[\\]\\n]*[.!?]$')) %}
    Start with a capital letter, end with a period, and leave out <, >, [ and ].
    {% endif %}

kind:
  type: str
  help: What it ships
  choices:
    A program that people download, such as a command-line tool or a desktop app: binary
    A long-running service shipped as a container image: service
    A library: library

visibility:
  type: str
  help: >-
    Who can see the repository. A private one's releases aren't attested or signed, its security
    reports go in issues, protecting its main branch needs a paid GitHub plan, and its CI draws on
    the account's included Actions usage. The generated docs/maintaining.md has the details.
  choices:
    Public: public
    Private: private
  default: public
  # Copier drops a stored answer that fails its validator and takes the default, without asking.
  # So a check that compares two answers refuses only when its own question's answer is passed in
  # this run, and leaves a stored answer to the other question's check. Without this one, a
  # published library's `publish_crate` would turn off. A stored or `--data-file` answer is a
  # boolean here, and a `--data publish_crate=...` value is still a string, which `publish_crate`'s
  # validator checks.
  validator: >-
    {% if visibility == 'private' and 'visibility' in _copier_conf.data and publish_crate is defined
    and publish_crate is sameas true %}
    A crate on crates.io is public, so a published library's repository stays public. To make it
    private, stop publishing too: pass `--data publish_crate=false`.
    {% endif %}

platforms:
  type: str
  help: The platforms CI tests on and releases for
  multiselect: true
  choices:
    Linux: linux
    macOS: macos
    Windows: windows
  default: [linux, macos, windows]
  when: "{{ kind != 'service' }}"
  validator: "{% if not platforms %}Pick at least one platform.{% endif %}"

architectures:
  type: str
  help: >-
    The processors CI tests on and releases for on Linux and Windows, and that a service's image
    runs on; macOS is always Apple silicon. ARM64 runners are free for a public repository and draw
    on a private one's included Actions usage.
  multiselect: true
  choices:
    x86-64: x86_64
    ARM64: aarch64
  default: "{{ ['x86_64', 'aarch64'] if visibility == 'public' else ['x86_64'] }}"
  when: "{{ kind == 'service' or 'linux' in platforms or 'windows' in platforms }}"
  validator: "{% if not architectures %}Pick at least one architecture.{% endif %}"

web_ui:
  type: bool
  help: >-
    Serve a web UI: a Bun app in `crates/<name>/web` that `just ci` checks and builds, and whose
    build the container image, or a binary's release archives, ship. Most projects don't need one.
  default: false
  when: "{{ kind != 'library' }}"

build:
  type: yaml
  help: >-
    What a binary's builds need beyond Rust, as a YAML mapping, or {} for nothing. `libc: gnu`
    builds for Linux with glibc instead of musl, for a program that links system libraries such as
    GTK or Vulkan. `setup: true` runs `.github/setup-build.sh` before every CI and release build,
    on each runner, to install what they need. `timeout` raises those builds' limit from 60
    minutes. Most binaries need nothing. Example: `{libc: gnu, setup: true, timeout: 90}`.
  default: {}
  when: "{{ kind == 'binary' }}"
  # Copier runs this even when it doesn't ask, so a `--data` answer can't reach another kind.
  validator: >-
    {%- set ns = namespace(error='') -%}
    {%- if build is not mapping -%}
    {%- set ns.error = 'Write a mapping, such as `{libc: gnu, setup: true}`, or `{}` for nothing.' -%}
    {%- elif build and kind != 'binary' -%}
    {%- set ns.error = 'Only a binary takes a `build` answer.' -%}
    {%- else -%}
    {%- for key in build if key not in ['libc', 'setup', 'timeout'] -%}
    {%- set ns.error = '`' ~ key ~ '` is not a key it takes; use `libc`, `setup` or `timeout`.' -%}
    {%- endfor -%}
    {%- if 'libc' in build and build.libc not in ['musl', 'gnu'] -%}
    {%- set ns.error = '`libc` is `musl`, the default, or `gnu`.' -%}
    {%- endif -%}
    {%- if 'setup' in build and build.setup is not boolean -%}
    {%- set ns.error = '`setup` is `true` or `false`.' -%}
    {%- endif -%}
    {%- if 'timeout' in build and (build.timeout is not integer or build.timeout is boolean or build.timeout < 60 or build.timeout > 360) -%}
    {%- set ns.error = '`timeout` is a number of minutes from 60 to 360.' -%}
    {%- endif -%}
    {%- endif -%}
    {{ ns.error }}

image:
  type: yaml
  help: >-
    What the service's image adds to its binary and license files, as a YAML mapping, or {} for
    nothing. `env` maps variable names to default values, each a string, quoted if YAML would read
    it as a number, a boolean, a date or null, `workdir` is the directory the service starts in,
    `expose` lists the ports it listens on, and `files: true` copies the tree in
    `crates/<crate>/image/`, where `<crate>` is the name with `_` for `-`, onto the image's root,
    such as a notice at `crates/<crate>/image/usr/share/doc/<name>/NOTICE`. Most services need
    nothing.
    Example: `{env: {PORT: "8080"}, workdir: /app, expose: [8080]}`.
  default: {}
  when: "{{ kind == 'service' }}"
  # Every value lands in a Containerfile instruction, so each is held to a form that instruction
  # reads one way: `\Z`, unlike `$`, doesn't match before a last line feed. An env value must be a
  # string, since YAML reads an unquoted `0022` or `1.10` as a number and drops what was written.
  # The image's own top-level directories are refused as a workdir, as the Containerfile refuses
  # them as files, since the copy would reset their owners and modes. Copier runs this even when it
  # doesn't ask, so a `--data` answer can't reach another kind.
  validator: >-
    {%- set ns = namespace(error='') -%}
    {%- set own = ['bin', 'boot', 'dev', 'etc', 'home', 'lib', 'lib32', 'lib64', 'libx32', 'proc', 'root', 'run', 'sbin', 'sys', 'tmp', 'var'] -%}
    {%- set web_dir = (project_name | replace('-', '_') | upper) ~ '_WEB_DIR' -%}
    {%- if image is not mapping -%}
    {%- set ns.error = 'Write a mapping, such as `{env: {PORT: "8080"}}`, or `{}` for nothing.' -%}
    {%- elif image and kind != 'service' -%}
    {%- set ns.error = 'Only a service takes an `image` answer.' -%}
    {%- else -%}
    {%- for key in image if key not in ['env', 'workdir', 'expose', 'files'] -%}
    {%- set ns.error = '`' ~ key ~ '` is not a key it takes; use `env`, `workdir`, `expose` or `files`.' -%}
    {%- endfor -%}
    {%- if 'env' in image -%}
    {%- if image.env is not mapping -%}
    {%- set ns.error = '`env` maps variable names to values, such as `{PORT: "8080"}`.' -%}
    {%- else -%}
    {%- for name, value in image.env.items() -%}
    {%- if not (name is string and name | regex_search('^[A-Za-z_][A-Za-z0-9_]*\\Z')) -%}
    {%- set ns.error = '`' ~ name ~ '` in `env` is not a variable name: use letters, digits and `_`.' -%}
    {%- elif name == web_dir -%}
    {%- set ns.error = '`' ~ name ~ '` in `env` is the variable trellis sets to the web UI it puts in the image.' -%}
    {%- elif value is not string or value | length > 4096 or value | regex_search('[\\x00-\\x1f\\x7f-\\x9f\\u2028\\u2029]') -%}
    {%- set ns.error = '`env`\'s `' ~ name ~ '` needs a quoted one-line string of at most 4096 characters, such as `"8080"`.' -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- if 'workdir' in image -%}
    {%- if not (image.workdir is string and image.workdir | regex_search('^(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+\\Z')) -%}
    {%- set ns.error = '`workdir` is an absolute path whose parts are letters, digits and `._-`, not starting with a dot, such as `/app`.' -%}
    {%- elif image.workdir.split('/')[1] in own or (image.workdir.split('/')[1] == 'usr' and image.workdir.split('/')[2] | default('') != 'share') -%}
    {%- set ns.error = '`workdir` is under the image\'s own /' ~ image.workdir.split('/')[1] ~ '; use /usr/share or a directory of its own, such as /app.' -%}
    {%- endif -%}
    {%- endif -%}
    {%- if 'expose' in image -%}
    {%- if image.expose is string or image.expose is not iterable or image.expose is mapping -%}
    {%- set ns.error = '`expose` lists ports, such as `[8080, 9000/udp]`.' -%}
    {%- else -%}
    {%- for port in image.expose if port is boolean or not ((port | string) | regex_search('^[1-9][0-9]{0,4}(/(tcp|udp))?\\Z') and (port | string).split('/')[0] | int <= 65535) -%}
    {%- set ns.error = '`' ~ port ~ '` in `expose` is not a port, such as `8080` or `9000/udp`.' -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- if 'files' in image and image.files is not boolean -%}
    {%- set ns.error = '`files` is `true` or `false`.' -%}
    {%- endif -%}
    {%- endif -%}
    {{ ns.error }}

publish_crate:
  type: bool
  help: >-
    Publish the library to crates.io. The lints allow no `cfg(feature = ...)`, so a published
    library has no optional features.
  default: false
  when: "{{ kind == 'library' }}"
  # The license comes after this question, so it is defined here only when it is stored or
  # passed. Without the license check, Copier would drop a stored `none`, which fails the
  # license's validator, and license the crate under the default. Like `visibility`'s check, it
  # applies only when `publish_crate` is passed, since otherwise Copier would drop a stored `true`
  # and unpublish the crate; the license's own validator refuses a passed `none` then.
  validator: >-
    {% if publish_crate and visibility == 'private' %}
    A crate on crates.io is public, so a private library can't publish one. Answer no, or make the
    repository public.
    {% elif publish_crate and 'publish_crate' in _copier_conf.data and license is defined
    and license == 'none' %}
    crates.io needs a license for a published crate. Pass one too, such as `--data license=MIT`.
    {% endif %}

license:
  type: str
  help: The license
  choices:
    MIT: MIT
    MIT or Apache-2.0: MIT OR Apache-2.0
    None (all rights reserved): none
  default: MIT
  validator: >-
    {% if kind == 'library' and publish_crate and license == 'none' %}
    crates.io needs a license for a published crate.
    {% endif %}

author:
  type: str
  help: The copyright holder
  default: "265866"

github_owner:
  type: str
  help: The GitHub user or organization that owns the repository
  default: "265866"

crate_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

# What CI tests on, a binary's release builds and a service's image runs on, one entry per target,
# in the order the docs list them. A binary's Linux builds use musl, which links statically, so its
# archives run on any Linux, unless its `build` answer asks for glibc; a library's consumers and a
# service's image use glibc.
targets:
  type: yaml
  default: >-
    {%- set os_list = ['linux'] if kind == 'service' else platforms -%}
    {%- set libc = 'musl' if kind == 'binary' and build.libc | default('musl') == 'musl' else 'gnu' -%}
    {%- set names = {'x86_64': 'x86-64', 'aarch64': 'ARM64'} -%}
    {%- set ns = namespace(targets=[]) -%}
    {%- if 'linux' in os_list -%}
    {%- for arch in ['x86_64', 'aarch64'] if arch in architectures -%}
    {%- set ns.targets = ns.targets + [{'os': 'linux', 'arch': arch,
      'name': 'Linux on ' ~ names[arch],
      'runner': 'ubuntu-24.04' if arch == 'x86_64' else 'ubuntu-24.04-arm',
      'triple': arch ~ '-unknown-linux-' ~ libc}] -%}
    {%- endfor -%}
    {%- endif -%}
    {%- if 'macos' in os_list -%}
    {%- set ns.targets = ns.targets + [{'os': 'macos', 'arch': 'aarch64',
      'name': 'macOS on Apple silicon', 'runner': 'macos-26', 'triple': 'aarch64-apple-darwin'}] -%}
    {%- endif -%}
    {%- if 'windows' in os_list -%}
    {%- for arch in ['x86_64', 'aarch64'] if arch in architectures -%}
    {%- set ns.targets = ns.targets + [{'os': 'windows', 'arch': arch,
      'name': 'Windows on ' ~ names[arch],
      'runner': 'windows-2025' if arch == 'x86_64' else 'windows-11-arm',
      'triple': arch ~ '-pc-windows-msvc'}] -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.targets | tojson }}
  when: false

# After `targets`, which its checks read.
release:
  type: yaml
  help: >-
    What a binary's releases attach, as a YAML mapping, or {} for trellis's archives. `files` maps
    each target triple to the names of the files `release/package.sh` writes for it, quoted, with
    `{version}` for the version, such as `{<target triple>: ["app-{version}.tar.gz"]}`, with an
    entry for each target the project releases for.
    `checksums` names the checksums file, `SHA256SUMS` by default, `name` is the name the release's
    title starts with, and `env` sets environment variables for the release's build only, each a
    string, quoted if YAML would read it as a number, a boolean, a date or null. `installer` maps a
    Windows target triple to an Inno Setup installer that the release builds, such as
    `{x86_64-pc-windows-msvc: {app_id: <GUID>, file: "app-{version}-setup.exe"}}`: `app_id` is a
    GUID that `uuidgen` prints, without braces, `file` one of that target's `files`, and `name`,
    optional, the name it shows, `name` above by default. Most binaries need nothing.
  default: {}
  when: "{{ kind == 'binary' }}"
  # Each value lands in a workflow or a docs page, so each is held to a form both read one way:
  # `\Z`, unlike `$`, doesn't match before a last line feed. A `files` entry for a target the
  # release doesn't build is allowed, and a target without one fails its release build, so a
  # change of platforms doesn't make Copier drop the whole answer, as it drops any stored answer
  # its checks refuse. Every file name holds `{version}`, so an attestation for one release's file
  # can't pass for another's, and the names are unique across targets, since the publish job puts
  # every target's files in one directory. An installer's `app_id` is how Windows finds the
  # installed program, so an answer, passed or typed, can't change the one the answers file holds,
  # and every target shares it. Copier also renders into empty directories during an update, with
  # every answer passed, `project_name` among them, where reading the missing answers file would
  # warn, so a run that passes `project_name` doesn't compare: a new project, which has no answers
  # file, passes it. Copier runs this even when it doesn't ask, so a `--data` answer can't reach
  # another kind.
  validator: >-
    {%- set ns = namespace(error='', names=[]) -%}
    {%- if release is not mapping -%}
    {%- set ns.error = 'Write a mapping, such as `{checksums: SHA256SUMS.txt}`, or `{}` for trellis\'s archives.' -%}
    {%- elif release and kind != 'binary' -%}
    {%- set ns.error = 'Only a binary takes a `release` answer.' -%}
    {%- else -%}
    {%- for key in release if key not in ['files', 'checksums', 'name', 'env', 'installer'] -%}
    {%- set ns.error = '`' ~ key ~ '` is not a key it takes; use `files`, `checksums`, `name`, `env` or `installer`.' -%}
    {%- endfor -%}
    {%- if 'name' in release and not (release.name is string and release.name | regex_search('^[A-Za-z0-9][A-Za-z0-9 ._+-]{0,63}\\Z')) -%}
    {%- set ns.error = '`name` is up to 64 letters, digits, spaces and `._+-`, such as `Arcwise`.' -%}
    {%- endif -%}
    {%- if 'checksums' in release and not (release.checksums is string and release.checksums | regex_search('^[A-Za-z0-9][A-Za-z0-9._-]{0,99}\\Z') and release.checksums != 'attestation.json') -%}
    {%- set ns.error = '`checksums` is a file name of letters, digits and `._-`, such as `SHA256SUMS.txt`, other than `attestation.json`.' -%}
    {%- endif -%}
    {%- if 'env' in release -%}
    {%- if release.env is not mapping -%}
    {%- set ns.error = '`env` maps variable names to values, such as `{APP_RELEASE: "1"}`.' -%}
    {%- else -%}
    {%- for name, value in release.env.items() -%}
    {%- if not (name is string and name | regex_search('^[A-Z_][A-Z0-9_]*\\Z')) or name in ['TARGET', 'PATH', 'BASH_ENV', 'RUSTFLAGS', 'RUSTUP_TOOLCHAIN', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER'] or name.startswith('GITHUB_') or name.startswith('RUNNER_') or name.startswith('CARGO_') -%}
    {%- set ns.error = '`' ~ name ~ '` in `env` is not a variable the release build may set: use capitals, digits and `_`, no `GITHUB_`, `RUNNER_` or `CARGO_` prefix, and none of the variables that change the toolchain, its flags or the shell.' -%}
    {%- elif value is not string or value | length > 4096 or value | regex_search('[\\x00-\\x1f\\x7f-\\x9f\\u2028\\u2029]') -%}
    {%- set ns.error = '`env`\'s `' ~ name ~ '` needs a quoted one-line string of at most 4096 characters, such as `"1"`.' -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- if 'files' in release -%}
    {%- if release.files is not mapping -%}
    {%- set ns.error = '`files` maps each target triple to its file names, such as `{<target triple>: ["app-{version}.tar.gz"]}`.' -%}
    {%- else -%}
    {%- for triple, names in release.files.items() -%}
    {%- if not (triple is string and triple | regex_search('^[a-z0-9_]+(-[a-z0-9_]+){2,3}\\Z')) -%}
    {%- set ns.error = '`' ~ triple ~ '` in `files` is not a target triple, such as `x86_64-pc-windows-msvc`.' -%}
    {%- elif names is string or names is not iterable or names is mapping or names | length == 0 -%}
    {%- set ns.error = '`files`\' `' ~ triple ~ '` lists at least one file name.' -%}
    {%- else -%}
    {%- for file in names -%}
    {%- if not (file is string and file | regex_search('^[A-Za-z0-9]([A-Za-z0-9._-]|\\{version\\})*\\Z') and '{version}' in file and file | length <= 200) -%}
    {%- set ns.error = '`' ~ file ~ '` in `files` is a file name of letters, digits and `._-` that holds `{version}`.' -%}
    {%- elif file in ns.names or file in ['attestation.json', release.checksums | default('SHA256SUMS')] -%}
    {%- set ns.error = '`' ~ file ~ '` in `files` is named twice, or names the checksums or the attestation.' -%}
    {%- endif -%}
    {%- set ns.names = ns.names + [file] -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- if 'installer' in release -%}
    {%- set files = release.files if release.files is defined and release.files is mapping else {} -%}
    {%- if release.installer is not mapping or not release.installer -%}
    {%- set ns.error = '`installer` maps a Windows target triple to its installer, such as `{x86_64-pc-windows-msvc: {app_id: <GUID>, file: "app-{version}-setup.exe"}}`.' -%}
    {%- else -%}
    {%- for triple, entry in release.installer.items() -%}
    {%- if triple not in ['x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc'] -%}
    {%- set ns.error = '`' ~ triple ~ '` in `installer` is not a Windows target: use `x86_64-pc-windows-msvc` or `aarch64-pc-windows-msvc`.' -%}
    {%- elif entry is not mapping -%}
    {%- set ns.error = '`installer`\'s `' ~ triple ~ '` maps `app_id` and `file`, and `name` if the installer shows another name than the release\'s.' -%}
    {%- else -%}
    {%- for key in entry if key not in ['app_id', 'file', 'name'] -%}
    {%- set ns.error = '`' ~ key ~ '` in `installer`\'s `' ~ triple ~ '` is not a key it takes; use `app_id`, `file` or `name`.' -%}
    {%- endfor -%}
    {%- if not (entry.app_id is defined and entry.app_id is string and entry.app_id | regex_search('^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}\\Z')) -%}
    {%- set ns.error = '`installer`\'s `' ~ triple ~ '` needs `app_id`, a new GUID without braces, such as `uuidgen` prints.' -%}
    {%- endif -%}
    {%- if not (entry.file is defined and entry.file is string and entry.file.endswith('.exe') and entry.file in files.get(triple, [])) -%}
    {%- set ns.error = '`installer`\'s `' ~ triple ~ '` needs `file`, one of the names `files` lists for it, ending in `.exe`.' -%}
    {%- endif -%}
    {%- if 'name' in entry and not (entry.name is string and entry.name | regex_search('^[A-Za-z0-9][A-Za-z0-9 ._+-]{0,63}\\Z')) -%}
    {%- set ns.error = '`installer`\'s `' ~ triple ~ '` has a `name` of up to 64 letters, digits, spaces and `._+-`, such as `Arcwise`.' -%}
    {%- endif -%}
    {%- endif -%}
    {%- endfor -%}
    {%- set ids = release.installer.values() | select('mapping') | map(attribute='app_id', default='') | unique | list -%}
    {%- if ids | length > 1 -%}
    {%- set ns.error = 'Every target in `installer` takes the same `app_id`: an x64 installer runs on ARM64 Windows too, and two AppIds would give one program two installs.' -%}
    {%- endif -%}
    {%- if 'project_name' not in _copier_conf.data -%}
    {%- set stored = (_external_data.previous or {}).release | default({}) -%}
    {%- set stored = stored.installer | default({}) if stored is mapping else {} -%}
    {%- for triple, entry in release.installer.items() if stored is mapping and entry is mapping and stored[triple] is defined and stored[triple] is mapping and stored[triple].app_id is defined and stored[triple].app_id != entry.app_id | default('') -%}
    {%- set ns.error = '`installer`\'s `' ~ triple ~ '` has `app_id` ' ~ stored[triple].app_id ~ ' in .copier-answers.yml. Windows finds the installed program by it, so it never changes: pass that `app_id` again.' -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}
    {{ ns.error }}

trellis_rev:
  type: str
  default: "{{ _copier_conf.vcs_ref_hash }}"
  when: false

trellis_path:
  type: str
  default: ""
  when: false
