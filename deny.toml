# `just deny` checks dependencies for advisories, licenses, banned crates and sources.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# An unmaintained crate fails only when this project depends on it directly.
unmaintained = "workspace"
ignore = []

[licenses]
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

# finl_unicode, which comrak reads Unicode categories with, also carries the Unicode data-file
# license of 2016, the earlier form of the Unicode-3.0 license allowed above. Only it may use it.
[[licenses.exceptions]]
crate = "finl_unicode"
allow = ["Unicode-DFS-2016"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[[bans.deny]]
crate = "ctor"
reason = "Google Rust Style Guide: don't run code before main()"

[[bans.deny]]
crate = "inventory"
reason = "Google Rust Style Guide: don't run code before main()"

[[bans.deny]]
crate = "linkme"
reason = "Google Rust Style Guide: don't run code before main()"

[[bans.deny]]
crate = "paste"
reason = "builds identifiers and attributes the custom lints can't read"

[[bans.deny]]
crate = "pastey"
reason = "builds identifiers and attributes the custom lints can't read"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
