[package]
name = "trellis_lints"
description = "Lints that check the Google Rust Style Guide rules clippy doesn't, and trellis's own rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = "=0.1.102"
dylint_linting = "6.3.0"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
dylint_testing = "6.3.0"
toml = "1"

[lints.rust]
# link.exe reports the import library it writes alongside every cdylib.
linker_messages = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

# The lints build on their own nightly toolchain, so they are a workspace of their own.
[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
