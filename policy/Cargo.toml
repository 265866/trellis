[package]
name = "trellis-policy"
description = "Checks the structure rules of a trellis project that the compiler and the lints can't see: crate lints and manifests, build scripts, proc macros, config and agent files, crate edges, workspace shape, the docs index and layout, the release changelog, and rule changes mixed with code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cargo_metadata.workspace = true
comrak.workspace = true
proc-macro2.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
