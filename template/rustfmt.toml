# `just fmt` formats with the nightly rustfmt pinned in the justfile: the Google Rust Style Guide
# asks for `imports_granularity` and `format_macro_matchers`, which only nightly rustfmt has.
edition = "2024"
style_edition = "2024"
max_width = 100
hex_literal_case = "Lower"
imports_granularity = "Module"
format_macro_matchers = true
